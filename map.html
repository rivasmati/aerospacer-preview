<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmacias adheridas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#F6F9F9}
  #map{width:100%;height:100%}
  .leaflet-container{font-family:"Source Sans 3",system-ui,sans-serif}
  .pin{background:#2FB4B8;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 6px rgba(18,42,44,.35)}
  .pop b{font-weight:600;color:#122A2C}
  .pop span{color:#5B6B6C;font-size:13px}
</style>
</head>
<body>
<div id="map"></div>
<script>
  var cities = [
    ["Ciudad de Buenos Aires", -34.6037, -58.3816, 14],
    ["La Plata", -34.9215, -57.9545, 4],
    ["Córdoba", -31.4201, -64.1888, 7],
    ["Rosario", -32.9442, -60.6505, 6],
    ["Mendoza", -32.8895, -68.8458, 5],
    ["Mar del Plata", -38.0055, -57.5426, 3],
    ["Santa Fe", -31.6333, -60.7000, 3],
    ["San Miguel de Tucumán", -26.8083, -65.2176, 3],
    ["Salta", -24.7859, -65.4117, 2],
    ["Neuquén", -38.9516, -68.0591, 2],
    ["Bahía Blanca", -38.7183, -62.2661, 2],
    ["San Juan", -31.5375, -68.5364, 2]
  ];
  var map = L.map('map', { scrollWheelZoom: false, zoomControl: true }).setView([-34.0, -63.5], 4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 18
  }).addTo(map);
  var bounds = [];
  cities.forEach(function (c) {
    var r = 9 + Math.min(c[3], 14) * 0.7;
    L.marker([c[1], c[2]], {
      icon: L.divIcon({ className: '', iconSize: [r, r], html: '<div class="pin" style="width:' + r + 'px;height:' + r + 'px"></div>' })
    }).addTo(map).bindPopup('<div class="pop"><b>' + c[0] + '</b><br><span>' + c[3] + ' farmacias adheridas</span></div>');
    bounds.push([c[1], c[2]]);
  });
  map.fitBounds(bounds, { padding: [40, 40] });
</script>
</body>
</html>
